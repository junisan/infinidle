<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Adivina la palabra en seis intentos y pasa a la siguiente, sin esperar a mañana. En español, con Ñ, de 5, 6 o 7 letras." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)" />
    <title>INFINIDLE · Adivina palabras sin límite</title>
    <!-- Fuera de buscadores (también va como cabecera X-Robots-Tag en public/_headers) -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Vista previa al compartir (WhatsApp, Telegram, X, Facebook…). %SITE_URL% lo pone vite.config.js -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INFINIDLE" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="INFINIDLE · Adivina palabras sin límite" />
    <meta property="og:description" content="Adivina la palabra en seis intentos y pasa a la siguiente, sin esperar a mañana. En español, con Ñ, de 5, 6 o 7 letras." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de INFINIDLE junto a un tablero en el que se adivina HABER al tercer intento" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Primero de todo: descarga las listas del modo guardado en paralelo con CSS, fuentes y React
      // (src/lib/words.js recoge la promesa). Va antes de cualquier hoja de estilos para no esperarla.
      ;(function () {
        // Intro (#intro) solo al arrancar en frío: la primera carga de la pestaña o de la app instalada.
        // sessionStorage sobrevive a las recargas, pero no a cerrar la pestaña o la app.
        var cold = false
        try {
          cold = !sessionStorage.getItem('infinidle:v1:booted')
          sessionStorage.setItem('infinidle:v1:booted', '1')
        } catch (e) {}
        if (cold) {
          document.documentElement.classList.add('intro')
          // src/lib/intro.js la termina. Tocar o pulsar una tecla la salta, sin que llegue al juego.
          var intro = (window.__infinidleIntro = { start: performance.now(), skipped: false, onskip: null })
          var events = ['keydown', 'pointerdown', 'click']
          var skip = function (e) {
            if (e.type === 'keydown' && (e.ctrlKey || e.metaKey || e.altKey)) return
            e.stopImmediatePropagation()
            e.preventDefault()
            if (e.type !== 'click' && !intro.skipped) {
              intro.skipped = true
              if (intro.onskip) intro.onskip()
            }
          }
          events.forEach(function (type) {
            addEventListener(type, skip, true)
          })
          intro.done = function () {
            events.forEach(function (type) {
              removeEventListener(type, skip, true)
            })
          }
        }

        var length = 5
        try {
          var saved = JSON.parse(localStorage.getItem('infinidle:v1:settings'))
          if (saved && [5, 6, 7].indexOf(saved.length) >= 0) length = saved.length
        } catch (e) {}
        // Direcciones de las listas (llevan hash en el nombre): las pone vite.config.js al construir
        var urls = %WORD_URLS%[length]
        window.__infinidlePreload = {
          length: length,
          lists: Promise.all(
            ['solutions', 'valid'].map(function (name) {
              return fetch(urls[name]).then(function (r) {
                if (!r.ok) throw new Error('No se pudo cargar ' + name)
                return r.text()
              })
            }),
          ),
        }
        window.__infinidlePreload.lists.catch(function () {})
      })()
    </script>
    <!-- Nunito servida desde aquí: solo pesos 600/900 y alfabeto latino (scripts/build-fonts.sh) -->
    <link rel="preload" href="/fonts/nunito-900.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Nunito';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/nunito-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-weight: 900;
        font-display: swap;
        src: url('/fonts/nunito-900.woff2') format('woff2');
      }
      /* Pantalla de arranque: se pinta con el HTML, antes de que lleguen CSS, JS y listas.
         Colores duplicados de src/index.css para no depender de él. */
      .splash {
        --teal: #1a9384;
        --ink: #16202b;
        --line: #9aa5b1;
        --soft: #6b7785;
        --tile: min(42px, calc((100vw - 90px) / 8));
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #fff;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        color: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          --ink: #eef2f6;
          --line: #56626f;
          --soft: #94a0ad;
          background: #11161c;
        }
      }
      .splash-logo {
        width: 64px;
        height: 64px;
      }
      .splash-row {
        display: flex;
        gap: 6px;
        perspective: 400px;
      }
      .splash-row span {
        width: var(--tile);
        height: var(--tile);
        display: grid;
        place-items: center;
        border: 2px solid var(--line);
        border-radius: 8px;
        font-size: calc(var(--tile) * 0.56);
        animation: splash-wave 1.6s ease-in-out infinite backwards;
      }
      .splash-row span:nth-child(2) { animation-delay: 110ms; }
      .splash-row span:nth-child(3) { animation-delay: 220ms; }
      .splash-row span:nth-child(4) { animation-delay: 330ms; }
      .splash-row span:nth-child(5) { animation-delay: 440ms; }
      .splash-row span:nth-child(6) { animation-delay: 550ms; }
      .splash-row span:nth-child(7) { animation-delay: 660ms; }
      .splash-row span:nth-child(8) { animation-delay: 770ms; }
      /* Ficha ∞: solo en móvil, cierra el cuadrado CAR / GAN / DO∞ y hace de logo */
      .splash-row .splash-inf {
        display: none;
        background: var(--teal);
        border-color: var(--teal);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-inf svg {
        width: 70%;
        height: 70%;
      }
      @media (max-width: 520px) {
        .splash {
          --tile: min(72px, 21vw);
        }
        .splash-logo {
          display: none;
        }
        .splash-row {
          display: grid;
          grid-template-columns: repeat(3, var(--tile));
        }
        .splash-row .splash-inf {
          display: grid;
        }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.92); }
      }
      .splash p {
        margin: 0;
        font-weight: 600;
        font-size: 14px;
        color: var(--soft);
      }
      @keyframes splash-wave {
        0%, 60%, 100% { transform: rotateX(0); background: transparent; color: var(--ink); }
        15% { transform: rotateX(90deg); }
        30%, 45% { transform: rotateX(0); background: var(--teal); border-color: var(--teal); color: #fff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-row span, .splash-row .splash-inf { animation: none; }
      }

      /* Intro del arranque en frío: INFINIDLE se voltea como el logo, INFINI se pliega en la ficha ∞ y
         src/lib/intro.js lleva el resultado hasta el logo de la cabecera. Fichas en proporción con las de
         .wordmark (hueco 3/32, radio 5/32, letra 0,62) para que al encogerse coincidan. */
      #intro {
        display: none;
      }
      html.intro #intro {
        --teal: #1a9384;
        --amber: #d9a21b;
        --slate: #5d6b7a;
        --ink: #16202b;
        --line: #9aa5b1;
        --soft: #6b7785;
        --t: min(48px, calc((100vw - 32px) / 9.75));
        --step: calc(var(--t) * 35 / 32);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 900;
        color: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        html.intro #intro {
          --ink: #eef2f6;
          --line: #56626f;
          --soft: #94a0ad;
          --slate: #363f4a;
          background: #11161c;
        }
      }
      html.intro .wordmark {
        visibility: hidden;
      }
      .intro-row {
        display: flex;
        gap: calc(var(--t) * 3 / 32);
        animation: intro-center 280ms ease-in-out 960ms both;
      }
      .intro-row span {
        position: relative;
        width: var(--t);
        height: var(--t);
        display: grid;
        place-items: center;
        border-radius: calc(var(--t) * 5 / 32);
        font-size: calc(var(--t) * 0.62);
        color: #fff;
        background: var(--teal);
        animation:
          intro-flip 560ms ease-in-out calc(80ms + var(--i) * 40ms) both,
          intro-fold 280ms ease-in-out 960ms both;
      }
      .intro-row span:nth-child(1) { --i: 0; z-index: 1; animation-name: intro-flip, none; }
      .intro-row span:nth-child(2) { --i: 1; }
      .intro-row span:nth-child(3) { --i: 2; }
      .intro-row span:nth-child(4) { --i: 3; }
      .intro-row span:nth-child(5) { --i: 4; }
      .intro-row span:nth-child(6) { --i: 5; }
      .intro-row span:nth-child(7) { --i: 6; animation-name: intro-flip, intro-slide; }
      .intro-row span:nth-child(8) { --i: 7; animation-name: intro-flip, intro-slide; }
      .intro-row span:nth-child(9) { --i: 8; animation-name: intro-flip, intro-slide; }
      /* La primera ficha cambia la I por ∞ mientras las demás de INFINI se pliegan sobre ella */
      .intro-row b,
      .intro-row svg {
        grid-area: 1 / 1;
        animation: intro-out 200ms ease-in 960ms both;
      }
      .intro-row svg {
        width: 82%;
        height: 82%;
        animation-name: intro-in;
        animation-delay: 1040ms;
      }
      .intro-wait {
        position: absolute;
        bottom: 28%;
        margin: 0;
        font-weight: 600;
        font-size: 14px;
        color: var(--soft);
        animation: intro-in 400ms ease 1800ms both;
      }
      /* Como logo-flip de src/index.css. Perspectiva propia de cada ficha: con una sola para toda la fila,
         las de los extremos se deforman. El plegado usa translate, que no choca con este transform. */
      @keyframes intro-flip {
        0% { transform: perspective(400px) rotateX(0); background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
        20% { transform: perspective(400px) rotateX(90deg); background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
        21% { background: var(--slate); color: #fff; box-shadow: none; }
        40% { transform: perspective(400px) rotateX(0); background: var(--slate); }
        55% { transform: perspective(400px) rotateX(90deg); background: var(--amber); }
        70% { transform: perspective(400px) rotateX(0); background: var(--amber); }
        85% { transform: perspective(400px) rotateX(90deg); background: var(--teal); }
        100% { transform: perspective(400px) rotateX(0); background: var(--teal); }
      }
      @keyframes intro-fold {
        to { translate: calc(var(--i) * -1 * var(--step)); opacity: 0; }
      }
      @keyframes intro-slide {
        to { translate: calc(-5 * var(--step)); }
      }
      /* Quedan 4 fichas de 9: se centra el grupo */
      @keyframes intro-center {
        to { translate: calc(2.5 * var(--step)); }
      }
      @keyframes intro-in {
        from { opacity: 0; }
      }
      @keyframes intro-out {
        to { opacity: 0; }
      }
      /* Sin movimiento: el logo final directamente, y src/lib/intro.js lo desvanece */
      @media (prefers-reduced-motion: reduce) {
        #intro *, #intro { animation-duration: 1ms !important; animation-delay: 0ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-logo">
        <div class="intro-row"><span><b>I</b><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"><path d="M12 12c-1.8-2.6-3.4-3.8-5.2-3.8a3.8 3.8 0 0 0 0 7.6c1.8 0 3.4-1.2 5.2-3.8s3.4-3.8 5.2-3.8a3.8 3.8 0 0 1 0 7.6c-1.8 0-3.4-1.2-5.2-3.8Z" /></svg></span><span>N</span><span>F</span><span>I</span><span>N</span><span>I</span><span>D</span><span>L</span><span>E</span></div>
      </div>
      <p class="intro-wait">Preparando palabras…</p>
    </div>
    <div id="root">
      <div class="splash" role="status" aria-label="Cargando">
        <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="12" fill="#1a9384" />
          <path
            d="M32 32C27.5 25.5 23.5 22.5 19 22.5a9.5 9.5 0 0 0 0 19c4.5 0 8.5-3 13-9.5s8.5-9.5 13-9.5a9.5 9.5 0 0 1 0 19c-4.5 0-8.5-3-13-9.5Z"
            fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round" />
        </svg>
        <div class="splash-row"><span>C</span><span>A</span><span>R</span><span>G</span><span>A</span><span>N</span><span>D</span><span>O</span><span class="splash-inf" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"><path d="M12 12c-1.8-2.6-3.4-3.8-5.2-3.8a3.8 3.8 0 0 0 0 7.6c1.8 0 3.4-1.2 5.2-3.8s3.4-3.8 5.2-3.8a3.8 3.8 0 0 1 0 7.6c-1.8 0-3.4-1.2-5.2-3.8Z" /></svg></span></div>
        <p id="splash-text">Preparando palabras…</p>
      </div>
    </div>
    <script>
      document.getElementById('splash-text').textContent =
        'Palabras de ' + window.__infinidlePreload.length + ' letras'
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
